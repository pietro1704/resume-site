version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ['next', 'react', 'react-dom']
      tooling:
        patterns: ['tailwindcss', 'postcss', 'autoprefixer']
      dev-deps:
        dependency-type: development
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ['ci', 'dependencies']
