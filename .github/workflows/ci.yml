name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build (PDFs + Next static export)
        run: npm run build

      - name: Verify generated artifacts
        run: |
          set -e
          slug=$(node -p "require('./data/pdf-manifest.json').slug")
          required_variants=("cv-pt" "cv-en" "cv-general" "cv-ats-pt" "cv-ats-en" "cv-casestudy-pt" "cv-casestudy-en" "cv-skills-pt" "cv-skills-en")
          for v in "${required_variants[@]}"; do
            f="out/pdfs/${slug}-${v}.pdf"
            if [ ! -s "$f" ]; then
              echo "Missing or empty: $f"
              ls out/pdfs/ || true
              exit 1
            fi
          done
          test -f out/index.html
          test -f out/download.html || test -d out/download
          echo "All required artifacts present (slug: $slug)."
