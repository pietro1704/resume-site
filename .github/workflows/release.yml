name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build (with example data)
        run: npm run build

      - name: Bundle example PDFs
        run: |
          set -e
          mkdir -p release-bundle
          cp out/pdfs/*.pdf release-bundle/ || true
          cd release-bundle && zip -9 ../example-pdfs.zip *.pdf

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          fi
          {
            echo "changelog<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            ## What's changed

            ${{ steps.changelog.outputs.changelog }}

            ## Artifacts

            `example-pdfs.zip` contains the six PDF templates rendered from
            `data/resume.example.json`, useful as a preview without cloning
            the repo.
          files: |
            example-pdfs.zip
          generate_release_notes: false
          draft: false
          prerelease: false
